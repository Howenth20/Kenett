<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="content">
      <form class="form">
        <input
          class="input"
          type="text"
          id="search"
          placeholder="Ingrese el nombre de la ciudad"
        />
        <div class="content_button">
          <button class="button">
            <img class="image_1" src="../Kenett/assest/buscar.png" alt="" />
          </button>
        </div>
      </form>
      <div class="box">
        <div>
          <p>Parciamente nublado</p>
        </div>
        <div class="content_img">
          <img class="img_2" src="../Kenett/assest/clima-ejemplo.webp" alt="" />
        </div>
        <div class="dat">
          <p class="text_dat">6°C</p>
          <p class="text_dat">Huancayo</p>
        </div>
        <div class="content_caracter">
          <div class="caracter">
            <img
              class="img_caracter"
              src="../Kenett/assest/humedad.png"
              alt=""
            />
            <div class="box_text">
              <p class="caracter_text">85%</p>
              <p class="caracter_text">Humedad</p>
            </div>
          </div>
          <div class="caracter">
            <img
              class="img_caracter_2"
              src="../Kenett/assest/viento.png"
              alt=""
            />
            <div class="box_text">
              <p class="caracter_text">4.3 km/h</p>
              <p class="caracter_text">Viento</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
