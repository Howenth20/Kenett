<!doctype html>

        </div>

      <div class="box">

          <p class="type_time" id="typeTime">-------------</p>
        </div>
        <div class="content_img">
          <img class="img_2" src="../assest/clima-ejemplo.webp" alt="" />
        </div>
        <div class="dat" id="dat">
        </div>
        <div class="content_caracter">

            <img
              class="img_caracter"
              src="../assest/humedad.png"
              alt=""
            />

            </div>
          </div>
          <div class="caracter">
            <img
              class="img_caracter_2"
              src="../assest/viento.png"
              alt=""
            />

    <footer>
        <a class="footer-link" href="./kenett.html" target="_blank" rel="noopener noreferrer">
